# OrbStack:  HOST_PORT=5350 docker compose up --build -d   ->  http://127.0.0.1:5350/api/health
# The server binds 0.0.0.0 INSIDE the container (NTNP_BIND is the opt-in), but the port is published on loopback only.
# No host mounts, no docker socket, no host network. Do not change the 127.0.0.1 below.
name: no-tool-no-promise

services:
  no-tool-no-promise:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-5350}:5350"
    environment:
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      NTNP_PORT: "5350"
      NTNP_BIND: 0.0.0.0
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5350/api/health').then(r=>r.json()).then(j=>process.exit(j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
